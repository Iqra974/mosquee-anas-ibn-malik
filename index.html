<!doctype html>
<html lang="fr">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#062d30"><meta name="mobile-web-app-capable" content="yes"><title>Mosquée Anas Ibn Malik</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css?v=20260818mobile5"><link rel="stylesheet" href="mobile.css?v=20260818mobile5"><script>(function(){var ua=navigator.userAgent||'';var touch=navigator.maxTouchPoints||0;var phone=/Android|iPhone|iPod|Mobile/i.test(ua);if(phone&&touch>0){document.documentElement.classList.add('real-mobile')}})();</script><style>html.real-mobile body{overflow-x:hidden!important;overflow-y:auto!important}html.real-mobile .screen{height:auto!important;min-height:100vh!important;overflow:visible!important}html.real-mobile .info-panel{height:auto!important;min-height:100vh!important;display:flex!important;flex-direction:column!important;padding:10px!important;gap:10px!important}html.real-mobile .dashboard{display:grid!important;grid-template-columns:1fr 1.8fr 1fr!important;grid-template-areas:'sunrise clock jumua'!important;gap:7px!important;transform:none!important}html.real-mobile .sunrise{grid-area:sunrise!important}html.real-mobile .clock-panel{grid-area:clock!important}html.real-mobile .jumua{grid-area:jumua!important}html.real-mobile .prayer-grid{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:8px!important;height:auto!important;align-self:stretch!important}html.real-mobile .prayer,html.real-mobile .prayer:last-child:nth-child(odd){grid-column:auto!important;width:auto!important;height:auto!important;min-height:150px!important;display:flex!important;flex-direction:column!important;align-items:center!important}html.real-mobile .prayer:last-child:nth-child(odd){grid-column:1/-1!important}html.real-mobile .prayer h2{font-size:clamp(1.3rem,6vw,1.8rem)!important}html.real-mobile .prayer time{font-size:clamp(2.1rem,10vw,3rem)!important}html.real-mobile .adhan-line strong{font-size:clamp(1.4rem,6vw,1.9rem)!important}</style></head>
<body>
<main class="screen">
  <section class="info-panel">
    <header class="top"><div class="mosque-names"><h1>Mosquée Anas Ibn Malik</h1><p class="brand-ar" lang="ar" dir="rtl">مسجد أنس بن مالك</p><p id="location">La Réunion</p></div></header>
    <section class="dashboard">
      <aside class="side-card sunrise"><span class="icon">☀</span><span>CHOUROUQ</span><strong id="sunrise">--:--</strong></aside>
      <section class="clock-panel"><time id="clock">--:--:--</time><div class="date-row"><p id="today">—</p><p class="hijri" id="hijri-date">—</p></div></section>
      <aside class="side-card jumua"><img class="jumua-minbar" src="images/minbar.png" alt="Minbar"><span>JUMU'A</span><strong id="jumua-time">—</strong></aside>
    </section>
    <section class="prayer-grid" id="prayer-grid" aria-label="Les cinq prières"></section>
    <section class="solar-info" id="solar-info" aria-label="Heures de début des prières">
      <div class="solar-times" id="solar-times">Début des prières : —</div>
      <div class="zenith-warning" id="zenith-box" hidden><strong>⚠ PRIÈRE INTERDITE AU ZÉNITH</strong><span id="zenith-warning">—</span></div>
    </section>
  </section>
  <aside class="mosque-photo" aria-label="Photo de la Mosquée Anas Ibn Malik"></aside>
</main>
<script src="config.js?v=20260818mobile5"></script><script src="app.js?v=20260818mobile5"></script><script>if('serviceWorker'in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js?v=5').catch(e=>console.error('Service Worker:',e)))}</script>
</body></html>
