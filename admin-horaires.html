<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Horaires — Administration</title><style>body{margin:0;font-family:Arial,sans-serif;background:#062f31;color:#fff}.wrap{max-width:760px;margin:auto;padding:18px}.card{background:#0a3b3e;border:1px solid #a9843e;border-radius:16px;padding:18px;margin:16px 0}h1,h2{color:#f2b83f}input{box-sizing:border-box;width:100%;padding:12px;border-radius:8px;border:1px solid #799;font-size:17px}button{border:0;border-radius:9px;padding:13px 16px;background:#f2b83f;color:#142c2d;font-weight:700;font-size:16px;margin-top:12px}.schedule{width:100%;border-collapse:collapse}.schedule th,.schedule td{padding:9px 4px;border-bottom:1px solid rgba(255,255,255,.12);text-align:center}.schedule td:first-child{text-align:left;font-weight:700}.status{display:none;margin-top:14px;padding:12px;border-radius:10px;white-space:pre-line;font-weight:700}.ok{display:block;background:#dff4dc;color:#174d20}.error{display:block;background:#ffe4e4;color:#7c1d1d}.warn{display:block;background:#fff2c7;color:#674b00}.login{max-width:460px;margin:6vh auto}.login input{margin:6px 0 10px}@media(max-width:650px){.wrap{padding:12px}.schedule input{min-width:80px}}</style><script src="supabase-config.js?v=20260901admin4"></script></head><body><main class="wrap"><section id="login" class="card login"><h1>Administration</h1><label>Email</label><input id="email" type="email" value="contact@iqra974.fr"><label>Mot de passe</label><input id="password" type="password"><button id="loginBtn">Se connecter</button><div id="loginStatus" class="status"></div></section><section id="app" style="display:none"><h1>Horaires de prière</h1><div class="card"><table class="schedule"><thead><tr><th>Prière</th><th>Adhan</th><th>Prière</th></tr></thead><tbody><tr><td>Fajr</td><td><input id="AdhanFajr" type="time"></td><td><input id="Fajr" type="time"></td></tr><tr><td>Dhuhr</td><td><input id="AdhanDhuhr" type="time"></td><td><input id="Dhuhr" type="time"></td></tr><tr><td>Asr</td><td><input id="AdhanAsr" type="time"></td><td><input id="Asr" type="time"></td></tr><tr><td>Maghrib</td><td>Auto</td><td>Auto</td></tr><tr><td>Isha</td><td><input id="AdhanIsha" type="time"></td><td><input id="Isha" type="time"></td></tr><tr><td>Jumu'a</td><td>—</td><td><input id="Jumua" type="time"></td></tr></tbody></table><button id="saveBtn">✓ Enregistrer</button><div id="status" class="status"></div></div></section></main><script>(function(){'use strict';var SB=window.MOSQUEE_SUPABASE,ID='anas-ibn-malik',token='';function q(id){return document.getElementById(id)}function msg(id,t,c){var e=q(id);e.className='status '+c;e.textContent=t}function ah(){return{apikey:SB.anonKey,Authorization:'Bearer '+token,'Content-Type':'application/json'}}function ph(){return{apikey:SB.anonKey,Authorization:'Bearer '+SB.anonKey}}function load(){fetch(SB.url+'/rest/v1/mosque_settings?id=eq.'+ID+'&select=prayers,adhan,jumua',{headers:ph(),cache:'no-store'}).then(function(r){if(!r.ok)throw Error('Lecture impossible ('+r.status+')');return r.json()}).then(function(rows){var s=rows[0]||{},p=s.prayers||{},a=s.adhan||{};['Fajr','Dhuhr','Asr','Isha'].forEach(function(n){q(n).value=p[n]||'';q('Adhan'+n).value=a[n]||''});q('Jumua').value=s.jumua||''}).catch(function(e){msg('status','⛔ '+e.message,'error')})}function login(){q('loginBtn').disabled=true;fetch(SB.url+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:SB.anonKey,'Content-Type':'application/json'},body:JSON.stringify({email:q('email').value.trim(),password:q('password').value})}).then(function(r){return r.json().then(function(d){if(!r.ok)throw Error(d.error_description||d.msg||'Connexion refusée');return d})}).then(function(d){token=d.access_token;sessionStorage.setItem('anasAdminToken',token);q('login').style.display='none';q('app').style.display='block';load()}).catch(function(e){msg('loginStatus','⛔ '+e.message,'error')}).then(function(){q('loginBtn').disabled=false})}function save(){if(!confirm('Confirmez-vous l’enregistrement des horaires ?'))return;msg('status','Enregistrement en cours…','warn');q('saveBtn').disabled=true;var prayers={Fajr:q('Fajr').value,Dhuhr:q('Dhuhr').value,Asr:q('Asr').value,Isha:q('Isha').value},adhan={Fajr:q('AdhanFajr').value,Dhuhr:q('AdhanDhuhr').value,Asr:q('AdhanAsr').value,Isha:q('AdhanIsha').value};fetch(SB.url+'/rest/v1/mosque_settings?id=eq.'+ID,{method:'PATCH',headers:Object.assign({},ah(),{Prefer:'return=representation'}),body:JSON.stringify({prayers:prayers,adhan:adhan,jumua:q('Jumua').value,updated_at:new Date().toISOString()})}).then(function(r){if(!r.ok)return r.text().then(function(t){throw Error('Enregistrement refusé ('+r.status+') '+t)});return r.json()}).then(function(rows){if(!rows.length)throw Error('Aucune donnée modifiée');msg('status','✓ Horaires enregistrés avec succès.','ok')}).catch(function(e){msg('status','⛔ '+e.message,'error')}).then(function(){q('saveBtn').disabled=false})}q('loginBtn').onclick=login;q('saveBtn').onclick=save;token=sessionStorage.getItem('anasAdminToken')||'';if(token){q('login').style.display='none';q('app').style.display='block';load()}})();</script></body></html>
